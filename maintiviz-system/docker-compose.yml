version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# MaintiViz Edge Engine — Docker Compose
# ──────────────────────────────────────────────────────────────────────────────
# Services:
#   ml-service  — Python FastAPI ML microservice (port 8000)
#   backend     — Node.js / Express API gateway (port 5000)
#   frontend    — Vite React dashboard (port 5173)
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Python ML Microservice ──────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: maintiviz-ml
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/model.pkl
    volumes:
      - ml_models:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Node.js Express Gateway ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maintiviz-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - ML_SERVICE_URL=http://ml-service:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      ml-service:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maintiviz-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ml_models:
    driver: local
